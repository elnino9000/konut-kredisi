name: APK olustur
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dosyalari yerlestir
        run: |
          if [ -f main.dart ]; then mkdir -p lib && mv main.dart lib/main.dart; fi
          flutter create --platforms=android --project-name konut_kredisi --org com.konutkredisi .
          sed -i 's#android:label="[^"]*"#android:label="Konut Kredi Hesaplama"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Uygulama simgesi
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - run: flutter pub get
      - run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: konut-kredisi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Son surum olarak yayinla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk konut-kredisi.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum konut-kredisi.apk \
            --target "$GITHUB_SHA" \
            --title "Konut Kredisi (son sürüm 1.0.${{ github.run_number }})" \
            --notes "Telefondan indirip kur: konut-kredisi.apk"
